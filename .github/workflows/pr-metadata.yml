name: PR Metadata Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title (conventional commits)
        id: title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -qiE '^(feat|fix|docs|chore|refactor|test|style|perf|ci|build|revert)(\(.+\))?:\s'; then
            echo "Title format: PASS"
          else
            echo "Title format: FAIL — must match conventional commits (feat:|fix:|docs:|chore:|refactor:|test:|style:|perf:|ci:|build:|revert:)"
            exit 1
          fi

      - name: Validate PR description not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "Description: FAIL — PR description is empty"
            exit 1
          fi
          echo "Description: PASS"

      - name: Validate no WIP/Draft markers in title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -qiE '^(WIP|Draft|DNM|DO NOT MERGE)'; then
            echo "WIP check: FAIL — title contains WIP/Draft marker"
            exit 1
          fi
          echo "WIP check: PASS"

      - name: Check diff size
        id: diff_size
        run: |
          ADDED=$(git diff --diff-filter=A --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)
          TOTAL_LINES=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD | wc -l)
          echo "added=$ADDED" >> $GITHUB_OUTPUT
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "lines=$TOTAL_LINES" >> $GITHUB_OUTPUT
          if [ "$TOTAL_LINES" -gt 2000 ]; then
            echo "Diff size: FAIL — $TOTAL_LINES lines exceeds 2000 limit"
            echo "Added files: $ADDED"
            echo "Changed files: $CHANGED"
            exit 1
          fi
          echo "Diff size: PASS ($TOTAL_LINES lines)"

      - name: Check changelog entry if feat/fix
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -qiE '^(feat|fix)(\(.+\))?:\s'; then
            if git log --oneline origin/${{ github.event.pull_request.base.ref }}...HEAD -- docs_mkdocs/changelog.md | grep -q .; then
              echo "Changelog: PASS — changelog modified"
            else
              echo "Changelog: WARNING — feat/fix PR should include a changelog entry in docs_mkdocs/changelog.md"
            fi
          else
            echo "Changelog: SKIP (not feat/fix)"
          fi

      - name: Post summary
        uses: actions/github-script@v7
        with:
          script: |
            const title = '${{ steps.title.outcome }}';
            const lines = '${{ steps.diff_size.outputs.lines }}';
            const changed = '${{ steps.diff_size.outputs.changed }}';
            const summary = `## PR Metadata Check
            | Check | Result |
            |-------|--------|
            | Title format | ✅ PASS |
            | Description | ✅ Non-empty |
            | No WIP/Draft | ✅ Clean |
            | Diff size | ✅ ${lines} lines (${changed} files) |
            | Changelog | ${title === 'skipped' ? '⏭️ Skipped' : '✅ Present'}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
