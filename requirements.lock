# requirements.lock — pinned CORE runtime dependencies for `obs`
#
# SINGLE SOURCE OF TRUTH for the isolated environment provisioned by:
#   - Homebrew formula  (virtualenv_install_with_resources → libexec/venv)
#   - install.sh        (~/.local/share/obs/venv)
#
# Derived from the [project.dependencies] block in pyproject.toml (core deps)
# plus mcp (added for mcp_server.py in v3.3.0).
#
# Pins are exact (==) for DIRECT deps. Transitive deps are included for
# completeness but resolve at install time. To regenerate after a pyproject
# floor bump, install the core set into a clean venv and freeze:
#   python3 -m venv /tmp/obs-lock && /tmp/obs-lock/bin/pip install \
#     python-frontmatter PyYAML networkx rich requests click "mcp[cli]" && \
#     /tmp/obs-lock/bin/pip freeze
#
