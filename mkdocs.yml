site_name: Obsidian CLI Ops
site_description: An Intelligent Command-Line Tool for Obsidian Vault Management
site_author: Data-Wise
site_url: https://data-wise.github.io/obsidian-cli-ops/
docs_dir: docs_mkdocs

repo_name: Data-Wise/obsidian-cli-ops
repo_url: https://github.com/Data-Wise/obsidian-cli-ops

theme:
  name: material
  palette:
    # Dark mode (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started:
      - ADHD Quick Start: adhd-quick-start.md
      - Installation: installation.md
      - Configuration: configuration.md
      - Usage: usage.md
  - Tutorials & Cookbook:
      - Overview: tutorials/index.md
      - Getting Started: tutorials/getting-started.md
      - Vault Management: tutorials/vault-management.md
      - Graph Analysis: tutorials/graph-analysis.md
      - AI Features: tutorials/ai-features.md
      - Claude / MCP Integration: tutorials/claude-mcp.md
      - Research Setup: tutorials/research-setup.md
      - Research Board: tutorials/research-board.md
      - Monitoring & Health: tutorials/monitoring-and-health.md
      - Vault↔Repo Mirroring: tutorials/flow-init.md
      - Diagnostics: tutorials/doctor.md
      - Configuration: tutorials/config.md
      - Search: tutorials/search.md
      - Cookbook: cookbook.md
  - Reference:
      - Overview: reference/index.md
      - Quick Reference Card: refcard.md
      - CLI Reference: cli-reference.md
      - Design Standards: design-standards.md
      - Visual Workflows: workflows.md
      - AI Setup Guide: ai-setup.md
      - Claude Integration: claude-integration.md
      - Changelog: changelog.md
  - Developer:
      - Architecture: developer/architecture.md
      - API Reference: developer/api-reference.md
      - Testing:
          - Overview: developer/testing/overview.md
          - Core Tests: developer/testing/core-tests.md
          - Sandbox: developer/testing/sandbox.md
      - Migration Guide: migration.md
  - Archive:
      - v1.1.0: archive/v1.1.0.md
      - v2.0: archive/v2.0.md
      - v2.2.0: archive/v2.2.0.md
      - v2.x: archive/v2.x.md
      - v3.0.0: archive/v3.0.0.md
      - R-Dev: archive/r-dev.md

extra_css:
  - stylesheets/adhd.css

